name: Generate Audio (Google TTS)

on:
  workflow_dispatch:
  push:
    paths:
      - 'scenes.json'
      - 'generate_audio.py'

permissions:
  contents: write

jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests google-auth

      - name: Generate audio
        env:
          TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python generate_audio.py

      - name: Commit generated audio
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add audio/ manifest.json sample_manifest.json 2>/dev/null || git add audio/
          if git diff --staged --quiet; then
            echo "No audio changes to commit."
          else
            git commit -m "Auto-generate audio [skip ci]"
            git push
          fi
