<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>女兒英語情景學習卡 · Daily English Cards</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang HK','Microsoft JhengHei','Noto Color Emoji','Apple Color Emoji',sans-serif;
    background:#fdfcf7; color:#3c4043; padding:16px 12px; display:flex; justify-content:center; }
  .wrap { width:100%; max-width:480px; }
  .apptitle { text-align:center; font-size:20px; color:#c9a227; padding:6px 0 12px; font-weight:700; }
  .card { background:#fff; border-radius:28px; box-shadow:0 8px 40px rgba(60,64,67,.08); overflow:hidden; }
  .topbar { display:flex; align-items:center; justify-content:space-between; padding:16px 22px 8px; }
  .topbar .day { font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:#80868b; font-weight:500; }
  .topbar .nav { display:flex; gap:8px; }
  .navbtn { width:36px; height:36px; border-radius:50%; border:1px solid #ececec; background:#fff; color:#80868b;
    font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .15s; }
  .navbtn:hover { background:#fef7e0; color:#3c4043; }
  .navbtn:disabled { opacity:.3; cursor:not-allowed; }
  /* 切換控制 */
  .controls { display:flex; gap:8px; padding:4px 22px 12px; flex-wrap:wrap; align-items:center; }
  .seg { display:inline-flex; background:#f2f0ea; border-radius:12px; padding:3px; }
  .seg button { border:none; background:transparent; padding:6px 12px; border-radius:9px; font-size:13px; cursor:pointer; color:#80868b; font-weight:600; transition:all .12s; }
  .seg button.on { background:#fff; color:#c9a227; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .gearlink { margin-left:auto; text-decoration:none; font-size:20px; opacity:.6; }
  .gearlink:hover { opacity:1; }
  .scene { text-align:center; padding:2px 22px 12px; }
  .scene .emoji { font-size:44px; }
  .scene h1 { font-size:25px; font-weight:700; margin-top:2px; }
  .scene .zh { font-size:15px; color:#80868b; margin-top:2px; }
  .illus { padding:0 22px; min-height:30px; }
  .illus img { width:100%; border-radius:20px; display:block; background:#f7f6f2; }
  .section { padding:20px 22px 0; }
  .label { font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:#a8a29a; font-weight:600;
    margin-bottom:12px; display:flex; align-items:center; gap:8px; }
  .vocab-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .vocab { background:#fef7e0; border-radius:16px; padding:12px; text-align:center; cursor:pointer; transition:transform .1s; }
  .vocab:active { transform:scale(.96); }
  .vocab .ico { font-size:28px; }
  .vocab .en { font-size:16px; font-weight:700; margin-top:2px; }
  .vocab .pron { font-size:11px; color:#a8896b; font-style:italic; }
  .vocab .zh { font-size:12px; color:#80868b; margin-top:2px; }
  .vocab .spk { font-size:10px; color:#c9a227; margin-top:3px; }
  .dialogue { display:flex; flex-direction:column; gap:11px; }
  .line { display:flex; gap:10px; align-items:flex-start; cursor:pointer; }
  .line .who { flex-shrink:0; width:38px; height:38px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:19px; }
  .line.Mama .who { background:#e6f4ea; }
  .line.Girl .who { background:#fce8e6; }
  .bubble { background:#f7f6f2; border-radius:4px 16px 16px 16px; padding:10px 13px; flex:1; transition:background .15s; }
  .line:active .bubble { background:#eee; }
  .bubble .tag { font-size:10px; color:#a8a29a; margin-bottom:2px; font-weight:600; display:flex; justify-content:space-between; }
  .bubble .en { font-size:15px; font-weight:500; line-height:1.35; }
  .bubble .zh { font-size:12px; color:#80868b; margin-top:3px; }
  .audio-row { display:flex; align-items:center; gap:10px; background:#e8f0fe; border-radius:14px; padding:12px 16px; }
  .audio-row .play { width:38px; height:38px; border-radius:50%; background:#4a7fb5; color:#fff; border:none;
    font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .audio-row .txt { font-size:13px; color:#5a6b82; }
  .task { background:#e6f4ea; border-radius:16px; padding:16px; display:flex; gap:12px; align-items:flex-start; }
  .task .ico { font-size:24px; }
  .task .t { font-size:14px; font-weight:700; color:#2e7d5b; }
  .task .d { font-size:13px; color:#5a7a68; margin-top:4px; line-height:1.5; }
  .footer { text-align:center; padding:18px 22px 24px; color:#c4beb4; font-size:11px; }
  .dots { display:flex; justify-content:center; gap:6px; padding:14px 0 4px; flex-wrap:wrap; }
  .dot { width:8px; height:8px; border-radius:50%; background:#e0ddd4; cursor:pointer; }
  .dot.active { background:#c9a227; width:22px; border-radius:4px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="apptitle">🌱 女兒英語情景學習卡</div>
    <div class="card">
      <div class="topbar">
        <span class="day" id="dayLabel">Loading…</span>
        <div class="nav">
          <button class="navbtn" id="prevBtn" title="上一張">&lsaquo;</button>
          <button class="navbtn" id="nextBtn" title="下一張">&rsaquo;</button>
        </div>
      </div>
      <div class="controls">
        <div class="seg" id="modeSeg">
          <button data-mode="natural" class="on">🗣️ 對答</button>
          <button data-mode="story">📖 故事</button>
        </div>
        <div class="seg" id="levelSeg">
          <button data-level="K3" class="on">K3</button>
          <button data-level="P1">P1</button>
          <button data-level="P2">P2</button>
        </div>
        <a class="gearlink" href="settings.html" title="設定">⚙️</a>
      </div>
      <div class="scene">
        <div class="emoji" id="sEmoji">⏳</div>
        <h1 id="sTitleEn">Loading</h1>
        <div class="zh" id="sTitleZh">載入中…</div>
      </div>
      <div class="illus"><img id="sImg" alt="情景插畫"></div>
      <div class="section">
        <div class="label"><span>📝</span> Words · 重點生字</div>
        <div class="vocab-grid" id="vocabGrid"></div>
      </div>
      <div class="section">
        <div class="label"><span>💬</span> Talk · 情景對話</div>
        <div class="dialogue" id="dialogueBox"></div>
      </div>
      <div class="section">
        <div class="label"><span>🔊</span> Listen · 聆聽發音</div>
        <div class="audio-row">
          <button class="play" id="playAll">▶</button>
          <span class="txt">播放成段對話（撳生字/句子亦可逐個聽）</span>
        </div>
      </div>
      <div class="section">
        <div class="label"><span>🎯</span> Play · 親子小任務</div>
        <div class="task"><div class="ico">🎯</div><div><div class="t">今日試吓……</div><div class="d" id="taskText"></div></div></div>
      </div>
      <div class="footer">🌱 女兒英語情景學習平台 · 每日一景</div>
    </div>
    <div class="dots" id="dots"></div>
  </div>

<script>
var scenes=[], manifest={}, idx=0, audioEl=new Audio();
var mode='natural', level='K3';
// 讀設定
var rate = parseFloat(localStorage.getItem('ec_rate')||'0.9');
var savedLevel = localStorage.getItem('ec_level'); if(savedLevel) level=savedLevel;

function speakFallback(text, isChild){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);
  u.lang='en-US'; u.rate=rate; u.pitch=isChild?1.3:1.0;
  window.speechSynthesis.speak(u);
}
function playAudio(file, text, isChild){
  if(file){ audioEl.pause(); audioEl.src=file; audioEl.playbackRate=1.0;
    audioEl.play().catch(function(){ speakFallback(text,isChild); }); }
  else { speakFallback(text,isChild); }
}
function curBlock(s){
  if(s.sets && s.sets[mode] && s.sets[mode][level]) return s.sets[mode][level];
  // 後備：舊格式
  if(s.levels && s.levels[level]) return s.levels[level];
  return {vocab:s.vocab||[], dialogue:s.dialogue||[]};
}
function curManifest(s){
  var m=manifest[s.id]||{};
  if(m[mode] && m[mode][level]) return m[mode][level];
  if(m[level]) return m[level];
  return m;
}
function render(){
  var s=scenes[idx];
  document.getElementById('dayLabel').textContent='Card '+(idx+1)+' / '+scenes.length;
  document.getElementById('sEmoji').textContent=s.emoji;
  document.getElementById('sTitleEn').textContent=s.title_en;
  document.getElementById('sTitleZh').textContent=s.title_zh;
  var img=document.getElementById('sImg'); img.style.display='block'; img.src=s.img||'';
  var block=curBlock(s), m=curManifest(s);
  var vg=document.getElementById('vocabGrid'); vg.innerHTML='';
  (block.vocab||[]).forEach(function(v,i){
    var d=document.createElement('div'); d.className='vocab';
    d.innerHTML='<div class="ico">'+v.ico+'</div><div class="en">'+v.en+'</div><div class="pron">'+v.pron+'</div><div class="zh">'+v.zh+'</div><div class="spk">🔊 撳我聽</div>';
    d.onclick=function(){ playAudio((m.vocab||[])[i], v.en, true); };
    vg.appendChild(d);
  });
  var db=document.getElementById('dialogueBox'); db.innerHTML='';
  (block.dialogue||[]).forEach(function(line,i){
    var d=document.createElement('div'); d.className='line '+line.who;
    d.innerHTML='<div class="who">'+line.icon+'</div><div class="bubble"><div class="tag"><span>'+line.who+'</span><span>🔊</span></div><div class="en">'+line.en+'</div><div class="zh">'+line.zh+'</div></div>';
    d.onclick=function(){ playAudio((m.dialogue||[])[i], line.en, line.who==='Girl'); };
    db.appendChild(d);
  });
  var task=s.task||{}; var tt=(typeof task==='object')?(task[level]||task.K3||''):task;
  document.getElementById('taskText').textContent=tt;
  var dots=document.getElementById('dots'); dots.innerHTML='';
  scenes.forEach(function(_,i){
    var dot=document.createElement('div'); dot.className='dot'+(i===idx?' active':'');
    dot.onclick=function(){ idx=i; render(); window.scrollTo(0,0); };
    dots.appendChild(dot);
  });
  document.getElementById('prevBtn').disabled=idx===0;
  document.getElementById('nextBtn').disabled=idx===scenes.length-1;
}
function playAllLines(){
  var s=scenes[idx], block=curBlock(s), m=curManifest(s), i=0;
  var lines=block.dialogue||[];
  function next(){
    if(i>=lines.length) return;
    var line=lines[i], file=(m.dialogue||[])[i];
    if(file){ audioEl.pause(); audioEl.src=file; audioEl.onended=function(){ i++; next(); };
      audioEl.play().catch(function(){ speakFallback(line.en, line.who==='Girl'); i++; setTimeout(next,1600); }); }
    else { speakFallback(line.en, line.who==='Girl'); i++; setTimeout(next,1900); }
  }
  next();
}
// 切換掣
function setupSeg(segId, attr, cb){
  var seg=document.getElementById(segId);
  seg.querySelectorAll('button').forEach(function(b){
    b.onclick=function(){
      seg.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on'); cb(b.getAttribute(attr)); render();
    };
    if(b.getAttribute(attr)===(attr==='data-level'?level:mode)) b.classList.add('on'); else b.classList.remove('on');
  });
}
document.getElementById('prevBtn').onclick=function(){ if(idx>0){idx--;render();window.scrollTo(0,0);} };
document.getElementById('nextBtn').onclick=function(){ if(idx<scenes.length-1){idx++;render();window.scrollTo(0,0);} };
document.getElementById('playAll').onclick=playAllLines;

fetch('scenes.json').then(function(r){return r.json();}).then(function(data){
  scenes=data.scenes;
  setupSeg('modeSeg','data-mode',function(v){mode=v;});
  setupSeg('levelSeg','data-level',function(v){level=v; localStorage.setItem('ec_level',v);});
  return fetch('manifest.json').then(function(r){return r.ok?r.json():{};}).catch(function(){return {};});
}).then(function(m){ manifest=m||{}; render(); }).catch(function(e){
  document.getElementById('sTitleEn').textContent='載入失敗';
  document.getElementById('sTitleZh').textContent=String(e);
});
</script>
</body>
</html>
