<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>設定 · Settings</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang HK','Microsoft JhengHei','Noto Color Emoji',sans-serif;
    background:#fdfcf7; color:#3c4043; padding:20px 14px; display:flex; justify-content:center; }
  .wrap { width:100%; max-width:460px; }
  .top { display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .back { text-decoration:none; font-size:22px; color:#80868b; }
  .top h1 { font-size:22px; color:#c9a227; }
  .card { background:#fff; border-radius:22px; box-shadow:0 6px 30px rgba(60,64,67,.07); padding:22px; margin-bottom:16px; }
  .card h2 { font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:#a8a29a; margin-bottom:14px; }
  .row { margin-bottom:8px; }
  .val { font-size:15px; font-weight:700; color:#c9a227; float:right; }
  input[type=range] { width:100%; margin-top:10px; accent-color:#c9a227; height:6px; }
  .seg { display:inline-flex; background:#f2f0ea; border-radius:12px; padding:4px; margin-top:6px; }
  .seg button { border:none; background:transparent; padding:9px 20px; border-radius:9px; font-size:15px; cursor:pointer; color:#80868b; font-weight:600; transition:all .12s; }
  .seg button.on { background:#fff; color:#c9a227; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .voice-row { display:flex; align-items:center; gap:12px; padding:10px 0; }
  .voice-row .ic { width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px; }
  .voice-row.mama .ic { background:#e6f4ea; } .voice-row.girl .ic { background:#fce8e6; }
  .voice-row .info .n { font-size:15px; font-weight:700; } .voice-row .info .d { font-size:12px; color:#80868b; }
  .hint { font-size:12px; color:#a8a29a; margin-top:6px; line-height:1.5; }
  .test { margin-top:12px; background:#e8f0fe; border:none; color:#4a7fb5; padding:10px 16px; border-radius:12px; font-size:14px; cursor:pointer; font-weight:600; }
  .saved { text-align:center; color:#2e7d5b; font-size:13px; margin-top:8px; height:16px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="top"><a class="back" href="index.html">&lsaquo;</a><h1>⚙️ 設定 Settings</h1></div>

    <div class="card">
      <h2>🐢 語速 Speaking Speed</h2>
      <div class="row"><span>朗讀速度</span><span class="val" id="rateVal">0.9x</span></div>
      <input type="range" id="rate" min="0.6" max="1.1" step="0.05" value="0.9">
      <div class="hint">調慢啲方便女兒跟讀。0.6x 最慢、1.1x 正常偏快。</div>
      <button class="test" id="testBtn">🔊 試聽速度</button>
    </div>

    <div class="card">
      <h2>📊 預設難度 Default Level</h2>
      <div class="seg" id="levelSeg">
        <button data-level="K3">K3</button>
        <button data-level="P1">P1</button>
        <button data-level="P2">P2</button>
      </div>
      <div class="hint">K3 (5-6歲) → P1 (6-7歲) → P2 (7-8歲)，句量同詞彙遞增。每張卡上都可以即時切換。</div>
    </div>

    <div class="card">
      <h2>🎙️ 語音 Voices（預設定）</h2>
      <div class="voice-row mama"><div class="ic">👩</div><div class="info"><div class="n">媽媽 · Gacrux</div><div class="d">溫柔媽媽語氣 (warm mummy tone)</div></div></div>
      <div class="voice-row girl"><div class="ic">👧</div><div class="info"><div class="n">女兒 · Kore</div><div class="d">活潑女童語氣 (energetic child tone)</div></div></div>
      <div class="hint">語音由 Google Gemini TTS 生成。「自選語音」功能之後會加入。</div>
    </div>

    <div class="saved" id="saved"></div>
  </div>

<script>
var rate=parseFloat(localStorage.getItem('ec_rate')||'0.9');
var level=localStorage.getItem('ec_level')||'K3';
var rateEl=document.getElementById('rate'), rateVal=document.getElementById('rateVal');
rateEl.value=rate; rateVal.textContent=rate.toFixed(2)+'x';
function flashSaved(){ var s=document.getElementById('saved'); s.textContent='✓ 已儲存'; setTimeout(function(){s.textContent='';},1200); }
rateEl.oninput=function(){ rate=parseFloat(rateEl.value); rateVal.textContent=rate.toFixed(2)+'x'; localStorage.setItem('ec_rate',rate); flashSaved(); };
document.getElementById('testBtn').onclick=function(){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance('I want my toothbrush, please.');
  u.lang='en-US'; u.rate=rate; u.pitch=1.2; window.speechSynthesis.speak(u);
};
var seg=document.getElementById('levelSeg');
seg.querySelectorAll('button').forEach(function(b){
  if(b.getAttribute('data-level')===level) b.classList.add('on');
  b.onclick=function(){
    seg.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on'); level=b.getAttribute('data-level'); localStorage.setItem('ec_level',level); flashSaved();
  };
});
</script>
</body>
</html>
